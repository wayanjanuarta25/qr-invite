<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Digital & Tiket Masuk QR</title>
  <link rel="icon" type="image/png" href="/assets/images/logo-shield-satsiber.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#DC2626',
              navy: '#0F172A',
              soft: '#FEF2F2',
              gold: '#D4AF37'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- html2canvas for ticket pass download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center justify-center p-3 sm:p-6" x-data="guestInvitePage()">

  <div class="w-full max-w-lg my-4 sm:my-6">

    <!-- Loading State -->
    <div x-show="loading" class="bg-white rounded-3xl p-8 sm:p-12 text-center shadow-xl border border-slate-200">
      <i data-lucide="loader-2" class="w-10 h-10 animate-spin text-red-600 mx-auto mb-4"></i>
      <p class="text-sm font-bold text-slate-700">Memuat Undangan Digital...</p>
    </div>

    <!-- Error State -->
    <div x-show="!loading && error" x-cloak class="bg-white rounded-3xl p-6 sm:p-8 text-center shadow-xl border border-rose-200">
      <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4">
        <i data-lucide="alert-circle" class="w-7 h-7 sm:w-8 sm:h-8"></i>
      </div>
      <h2 class="text-lg sm:text-xl font-bold text-slate-900 mb-2">Undangan Tidak Ditemukan</h2>
      <p class="text-xs text-slate-500 mb-6" x-text="error"></p>
      <a href="/" class="inline-flex items-center space-x-2 px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold shadow-md shadow-red-600/30">
        <span>Kembali ke Beranda</span>
      </a>
    </div>

    <!-- Digital Invitation Card -->
    <div x-show="!loading && invite" x-cloak class="space-y-4 sm:space-y-6">
      
      <!-- Main Card Container -->
      <div id="invitation-ticket-card" class="bg-white rounded-2xl sm:rounded-3xl shadow-2xl border border-slate-200/90 overflow-hidden relative">
        
        <!-- Header Banner with Gold Ribbon -->
        <div class="bg-gradient-to-r from-[#200407] via-[#35080e] to-[#200407] p-6 sm:p-8 text-center text-white relative">
          <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-gradient-to-r from-transparent via-[#D4AF37] to-transparent rounded-full"></div>
          
          <img src="/assets/images/logo-shield-satsiber.png" alt="Logo Shield Satsiber" class="h-12 sm:h-14 w-auto mx-auto mb-3 object-contain drop-shadow">

          <div class="text-[10px] sm:text-[11px] uppercase tracking-[0.2em] font-extrabold text-[#D4AF37] mb-1.5 sm:mb-2">
            OFFICIAL DIGITAL INVITATION
          </div>
          
          <h1 class="text-xl sm:text-3xl font-extrabold font-serif-luxury tracking-tight leading-snug my-1 sm:my-2" x-text="invite?.event_name">
          </h1>

          <p class="text-xs text-red-200/80 max-w-sm mx-auto font-light mt-1.5 sm:mt-2" x-text="invite?.event_description"></p>
        </div>

        <!-- Guest Personalized Section -->
        <div class="p-5 sm:p-8 text-center">
          
          <div class="text-xs text-slate-400 font-medium mb-1">
            Kepada Yth. Bapak/Ibu/Saudara/i:
          </div>

          <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 mb-2 tracking-tight" x-text="invite?.name"></h2>


          <!-- Divider with diamond -->
          <div class="relative my-4 sm:my-6 flex items-center justify-center">
            <div class="border-t border-slate-200 w-full"></div>
            <div class="absolute bg-white px-3 text-red-600 text-xs">◆ ◆ ◆</div>
          </div>

          <!-- Event Details Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 text-left p-3.5 sm:p-4 rounded-xl sm:rounded-2xl bg-slate-50 border border-slate-100 text-xs">
            <div class="flex items-start space-x-3">
              <div class="w-8 h-8 rounded-lg bg-red-100 text-red-600 flex items-center justify-center shrink-0">
                <i data-lucide="calendar" class="w-4 h-4"></i>
              </div>
              <div class="min-w-0">
                <div class="text-[10px] text-slate-400 uppercase font-bold">Waktu Acara</div>
                <div class="font-bold text-slate-800 break-words" x-text="invite?.event_date"></div>
              </div>
            </div>

            <div class="flex items-start space-x-3">
              <div class="w-8 h-8 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center shrink-0">
                <i data-lucide="map-pin" class="w-4 h-4"></i>
              </div>
              <div class="min-w-0">
                <div class="text-[10px] text-slate-400 uppercase font-bold">Lokasi Venue</div>
                <div class="font-bold text-slate-800 break-words" x-text="invite?.event_location"></div>
              </div>
            </div>
          </div>

          <!-- QR Attendance Pass Box -->
          <div class="mt-6 sm:mt-8 p-4 sm:p-6 rounded-2xl bg-red-50/40 border border-red-100 flex flex-col items-center">
            <div class="text-xs uppercase font-extrabold tracking-wider text-red-700 mb-3">
              QR Code Presensi Kehadiran
            </div>

            <div class="p-3 bg-white rounded-2xl shadow-md border border-slate-200">
              <img :src="invite?.qr_image" alt="QR Code" class="w-44 h-44 sm:w-52 sm:h-52 object-contain rounded-lg">
            </div>

            <div class="mt-3 text-xs text-slate-500 font-mono" x-text="'Kode Token: ' + invite?.qr_token"></div>

            <!-- Attendance Status Badge -->
            <div class="mt-4">
              <template x-if="invite?.attendance_status === 'PRESENT'">
                <div class="inline-flex items-center space-x-1.5 px-3.5 sm:px-4 py-2 rounded-xl bg-emerald-100 border border-emerald-300 text-emerald-800 text-xs font-bold">
                  <i data-lucide="check-circle" class="w-4 h-4"></i>
                  <span>Status: SUDAH HADIR (<span x-text="invite?.formatted_arrival"></span>)</span>
                </div>
              </template>
              <template x-if="invite?.attendance_status !== 'PRESENT'">
                <div class="text-[11px] text-slate-500">
                  Tunjukkan QR Code ini pada petugas penerima tamu saat tiba di lokasi acara.
                </div>
              </template>
            </div>

          </div>

        </div>

        <!-- Footer Card -->
        <div class="p-3.5 sm:p-4 bg-slate-50 border-t border-slate-100 text-center text-[10px] sm:text-[11px] text-slate-400">
          Digital Invitation Pass • Generated securely by Digital Invitation System
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row items-center gap-2.5 sm:gap-3">
        <button 
          @click="downloadTicketPass()"
          class="w-full sm:flex-1 py-3 px-4 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-xs shadow-lg shadow-red-600/30 flex items-center justify-center space-x-2 transition-all cursor-pointer"
        >
          <i data-lucide="download" class="w-4 h-4"></i>
          <span>Simpan Tiket ke Galeri (PNG)</span>
        </button>

        <a 
          :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(invite?.event_location || '')"
          target="_blank"
          class="w-full sm:flex-1 py-3 px-4 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold text-xs shadow-sm flex items-center justify-center space-x-2 transition-all cursor-pointer"
        >
          <i data-lucide="map" class="w-4 h-4 text-rose-500"></i>
          <span>Petunjuk Arah Google Maps</span>
        </a>
      </div>

    </div>

  </div>

  <script src="/assets/js/app.js"></script>
  <script>
    function guestInvitePage() {
      return {
        token: '',
        invite: null,
        loading: true,
        error: null,

        async init() {
          const pathSegments = window.location.pathname.split('/');
          this.token = pathSegments[pathSegments.length - 1];

          if (!this.token) {
            this.error = 'Token tidak valid.';
            this.loading = false;
            return;
          }

          try {
            const res = await App.api(`/api/invite/${encodeURIComponent(this.token)}`);
            this.invite = res.invitation;
          } catch (err) {
            this.error = err.message || 'Undangan tidak ditemukan.';
          } finally {
            this.loading = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        getCategoryClass(category) {
          switch ((category || '').toLowerCase()) {
            case 'vip':
              return 'bg-amber-100 text-amber-900 border-amber-300';
            case 'family':
              return 'bg-purple-100 text-purple-900 border-purple-300';
            case 'friend':
              return 'bg-red-100 text-red-900 border-red-300';
            default:
              return 'bg-slate-100 text-slate-800 border-slate-300';
          }
        },

                downloadOfficialPdf() {
          if (!this.invite || !this.invite.qr_token) return;
          App.toast("Sedang mengunduh dokumen PDF resmi...", "info");
          window.location.href = "/api/guests/token/" + this.invite.qr_token + "/invitation-pdf";
        },

        downloadTicketPass() {
          const card = document.getElementById('invitation-ticket-card');
          if (!card) return;

          App.toast('Menyimpan tiket undangan...', 'info');

          html2canvas(card, {
            scale: 2,
            useCORS: true,
            backgroundColor: '#FFFFFF'
          }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Tiket_${(this.invite?.name || 'Tamu').replace(/\s+/g, '_')}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            App.toast('Tiket berhasil disimpan!', 'success');
          }).catch(err => {
            App.toast('Gagal mengunduh gambar: ' + err.message, 'error');
          });
        }
      };
    }
  </script>
</body>
</html>
